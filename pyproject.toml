[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlite-k3"
version = "0.1.0"
description = "Moonshot AI Kimi K3 as an external model package for Megatron Lite"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yan Bai" }]
license = { file = "LICENSE" }
dependencies = ["torch>=2.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
kda = ["flash-linear-attention>=0.5.0"]

[project.scripts]
k3-validate-checkpoint = "mlite_k3.checkpoint_validation:main"
k3-validation-harness = "mlite_k3.validation_harness:main"
k3-rl-finite-gate = "mlite_k3.rl_finite_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "mlite: Megatron Lite tests",
  "smoke: integration smoke tests",
  "gpu: requires CUDA",
  "distributed: requires torch.distributed",
]
